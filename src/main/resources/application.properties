
spring.application.name=Talentscope
server.port=${PORT:8080}

# ===============================
# Database
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentscope_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:talentscope_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# GRPC
# ===============================

grpc.server.host=${GRPC_SERVER_HOST:localhost}
grpc.server.port=${GRPC_SERVER_PORT:9090}

# ===============================
# File Storage
# ===============================
storage.provider=${STORAGE_PROVIDER:local}
storage.location=${STORAGE_LOCATION:uploads/cvs}



# ===============================
# Supabase S3
# ===============================

supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://vezalbqxlvyjjaidutxj.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:eu-west-1}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:talentscope-cvs}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY:}

# ===============================
# File Upload
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# Logging
# ===============================

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ===============================
# Profiles
# ===============================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

